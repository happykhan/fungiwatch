name: Daily data update

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch:        # allow manual trigger from Actions UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3-hour ceiling (full fetch of all SRA can be slow)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Show environment
        run: |
          echo "=== Python version ==="
          pixi run python --version
          echo "=== datasets CLI version ==="
          pixi run datasets version
          echo "=== Last fetch date ==="
          cat metadata/last_fetch.json 2>/dev/null || echo "(no cache — will do full fetch)"

      - name: Fetch metadata from NCBI
        run: |
          echo "::group::fetch_metadata.py output"
          pixi run python -u fetch_metadata.py
          echo "::endgroup::"

      - name: Show fetch summary
        run: |
          echo "=== metadata/ directory ==="
          ls -lh metadata/*.json 2>/dev/null | awk '{print $5, $9}'
          echo "=== last_fetch.json ==="
          cat metadata/last_fetch.json

      - name: Generate HTML report
        run: |
          echo "::group::generate_report.py output"
          pixi run python -u generate_report.py
          echo "::endgroup::"

      - name: Show report size
        run: |
          echo "=== build/ ==="
          ls -lh build/

      - name: Run tests
        run: pixi run python -m pytest tests/ -v

      - name: Commit and push
        run: |
          git config user.name  "fungiwatch-bot"
          git config user.email "nabil@happykhan.com"
          git add metadata/ build/
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit needed."
          else
            CHANGED=$(git diff --staged --stat | tail -1)
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d) — ${CHANGED}"
            git push
            echo "Pushed."
          fi
