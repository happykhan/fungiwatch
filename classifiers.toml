# classifiers.toml — Curated keyword tables for host_category and submitter_category
#
# How matching works:
#   - The classifier joins relevant fields into one lowercase string ("blob").
#       host_category:      host + isolation_source + host_disease + env_broad_scale
#       submitter_category: submitter
#   - Categories are tried in the order listed in `order = [...]`. First match wins.
#   - For each category, two kinds of matchers run:
#       1. `exact_aliases`: matched against the WHOLE trimmed lowercase string.
#          Use this for short codes that would be dangerous as substrings (e.g. "BI").
#       2. `keywords`: substring matched anywhere in the blob.
#   - Everything is case-insensitive; write keywords in lowercase.
#
# Curation workflow:
#   1. Edit this file.
#   2. Run `pixi run python reclassify_hosts.py` to re-classify cached records.
#      (No NCBI re-fetch needed; classification is derived from existing fields.)
#   3. Run `pixi run python generate_report.py` to refresh the report and CSVs.
#   4. Optional: `pixi run python manuscript/metadata_richness_analysis.py` to
#      regenerate the brief.
#
# Notes:
#   - Priority order is intentional. `laboratory` is checked before `human`
#     because lab-derived strains often duplicate a clinical host on top.
#     `agriculture` is checked before `university` because labs like
#     "Cook Lab - University of California at Davis" are plant-pathology
#     groups despite the university affiliation.
#   - To force a specific submitter into a different category, add it to that
#     category's `exact_aliases` (safest) or add a distinctive substring to
#     `keywords` and ensure that category sits higher in `order`.

# =============================================================================
# host_category — derived per record from BioSample free-text fields
# =============================================================================

[host]
order = ["laboratory", "human", "clinical_other", "plant", "animal", "food", "environment"]

[host.laboratory]
description = "Lab-derived strains (not real-world sampling). Checked first because metadata often duplicates a clinical host name on top of a lab-evolved label."
keywords = [
    "in vitro", "in-vitro", "evolved", "evovled", "evolution experiment",
    "lab experiment", "laboratory experiment", "crispr",
    "transformed", "transformant", "mutant strain", "knockout",
    "engineered", "synthetic", "passaged", "serial passage",
    "adapted", "drug-evolved", "fluconazole evolved",
    "voriconazole evolved", "amphotericin evolved",
    "lab evolved", "lab-evolved", "in vitro selection",
    "lab adapted", "lab-adapted",
    "culture media", "ypd culture", " ypd ", "ypd",
    "frozen stock", "petri dish", "lab strain", "nrrl",
    "progeny strains", "mixed of progeny",
    "culture", "culture collection",
]

[host.human]
description = "Human clinical samples. Specific source types first."
keywords = [
    "homo sapiens", "human", "patient",
    "clinical isolate", "clinical sample", "clinical specimen", "clinical strain",
    "blood culture", "bronchoalveolar", "sputum", "csf",
    "cerebrospinal", "nail", "skin scraping", "vaginal", "urine",
    "stool", "throat swab", "ear swab", "blood", "oropharynx",
    "oropharanyx", "pharyngeal", "pulmonary", "lung", "tracheal",
    "wound", "bile", "peritoneal", "axilla", "groin", "liver",
    "clinical", "clinic",
]

[host.clinical_other]
description = "Healthcare-built environment (devices, surfaces, wards). Not patient samples."
keywords = [
    "hospital", "catheter", "ventilator", "endoscope",
    "healthcare", "medical device", "surgical",
    # Use bounded forms so 'icu' doesn't catch 'agriculture' / 'triticum'
    # and 'ward' doesn't catch 'Edward' / 'forward'.
    " icu ", " icu,", "icu/", " icu-", "icu_",
    " ward", "ward ", "wards ", " wards",
]

