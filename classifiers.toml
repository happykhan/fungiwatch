# =============================================================================
# submitter_category — derived per record from the `submitter` field
# =============================================================================

[submitter]
order = ["public_health", "agriculture", "hospital_clinical", "university", "research_institute", "commercial"]

[submitter.public_health]
description = "Government public health labs, CDCs, ministries of health, national reference labs."
# Exact aliases match the whole trimmed lowercase submitter string.
# Use for short codes that would be dangerous as substrings.
exact_aliases = ["uphl", "uphl_id", "nvsphl", "nsphl", "riphl", "lacphl", "ocphl_ca",
                  "mdh_csl", "mdhhs-gs", "mdhhs", "txdshs", "tn doh", "tn-doh",
                  "wsdoh", "nml", "nvwa"]
keywords = [
    # PHL-ish substrings that catch composite codes like "fda_NSPHL" or "MDUPHL".
    # Distinctive enough that false positives in submitter names are unlikely.
    "uphl", "nsphl", "mduphl", "phl_", "_phl",
    "public health", "centers for disease control",
    "centre for disease control", "center for disease control",
    "wisconsin state laboratory of hygiene",
    "department of health", "ministry of health",
    "national institute for communicable diseases",
    "national institute for biological standards",
    "national health laboratory service",
    "national microbiology laboratory",
    "national centre for infectious diseases",
    "national center for infectious diseases",
    "ukhsa", "public health england", "ecdc",
    "robert koch", "rki",
    "santé publique", "sante publique",
    "instituto de salud", "ministerio de salud",
    "national reference",
    "phl ", "phl_", "phl-",
    "cdc-ncezid", "cdc ", "cdc_", "cdc-",
    "anhui center for disease",
    "chinese center for disease",
    "korea centers for disease",
    "africa cdc",
    "wadsworth center",
]

